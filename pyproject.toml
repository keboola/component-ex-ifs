[project]
name = "ex-ifs"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "dateparser>=1.2.0",
    "keboola-component>=1.10.0",
    "pydantic>=2.11.7",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.24",
]

[tool.ruff]
line-length = 120
# Design/plan docs under docs/superpowers are process artifacts, not source — their
# illustrative code snippets must not be reformatted/linted by ruff (0.16+ formats
# code blocks inside Markdown, which otherwise breaks the repo-wide pre-commit hooks).
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
